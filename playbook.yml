- name: Ansible Pi stack deployment
  hosts: local
  connection: local
  become: true

  vars:
      stack_user: "{{ user | default('pi') }}"
      stack_path: "{{ compose_path | default('/home/pi/homelab-stack') }}"
      stack_compose_file: "{{ compose_file | default('docker-compose.yml') }}"
      docker_storage_path: "{{ docker_data_root | default('/mnt/nvme/docker') }}"
      service_bind_address_requested: "{{ service_bind_address | default('127.0.0.1') }}"
      tailscale_authkey_effective: "{{ tailscale_authkey | default(lookup('env', 'TAILSCALE_AUTHKEY'), true) }}"
      tailscale_hostname_effective: "{{ tailscale_hostname | default('homelab-pi') }}"
      tailscale_routes_effective: "{{ tailscale_advertise_routes | default('192.168.1.0/24') }}"
      node_exporter_textfile_path: "{{ node_exporter_textfile_dir | default('/var/lib/node_exporter/textfile') }}"
      install_homelab_healthcheck_effective: "{{ install_homelab_healthcheck | default(true) }}"
      install_homelab_thermal_monitor_effective: "{{ install_homelab_thermal_monitor | default(true) }}"

  pre_tasks:
      - name: Check Tailscale state
        stat:
            path: /var/lib/tailscale/tailscaled.state
        register: tailscale_state

      - name: Require Tailscale auth key for first setup
        assert:
            that:
                - tailscale_authkey_effective | length > 0
                - tailscale_authkey_effective != 'XXXXX'
            fail_msg: Set tailscale_authkey in group_vars/all.yml or export TAILSCALE_AUTHKEY before first provisioning.
        when: not tailscale_state.stat.exists

  tasks:
      - name: Require the expected NVMe UUID for healthchecks
        ansible.builtin.assert:
            that:
                - nvme_uuid | default('') is match('(?i)^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$')
            fail_msg: Set nvme_uuid to the expected ext4 filesystem UUID in group_vars/all.yml before enabling healthchecks.
        when: install_homelab_healthcheck_effective | bool

      - name: Remove legacy Debian repository previously added for log2ram
        file:
            path: /etc/apt/sources.list.d/bookworm.list
            state: absent

      - name: Install base packages
        apt:
            name:
                - docker.io
                - docker-compose-plugin
                - tailscale
                - samba
                - smartmontools
                - dnsutils
            state: present
            update_cache: true

      - name: Start docker
        service:
            name: docker
            state: started
            enabled: true

      - name: Enable service tailscale
        service:
            name: tailscaled
            state: started
            enabled: true

      - name: Enable IP forwarding for Tailscale routing
        ansible.posix.sysctl:
            name: "{{ item }}"
            value: "1"
            state: present
            sysctl_set: true
            sysctl_file: /etc/sysctl.d/99-tailscale.conf
            reload: true
        loop:
            - net.ipv4.ip_forward
            - net.ipv6.conf.all.forwarding
        when: (tailscale_routes_effective | length > 0) or (tailscale_advertise_exit_node | default(true) | bool)

      - name: Configure Tailscale routes and exit node
        command: >
            tailscale up
            {% if not tailscale_state.stat.exists %}--authkey={{ tailscale_authkey_effective }}{% endif %}
            --hostname={{ tailscale_hostname_effective }}
            --advertise-routes={{ tailscale_routes_effective }}
            {% if tailscale_advertise_exit_node | default(true) | bool %}--advertise-exit-node{% endif %}
        no_log: true
        changed_when: not tailscale_state.stat.exists
        when: not tailscale_state.stat.exists

      - name: Resolve Tailscale IPv4 address
        command: tailscale ip -4
        register: tailscale_ipv4
        changed_when: false
        check_mode: false
        tags:
            - always

      - name: Start Samba services
        service:
            name: "{{ item }}"
            state: started
            enabled: true
        loop:
            - smbd
            - nmbd

      - name: Install log2ram
        apt:
            name: log2ram
            state: present
            update_cache: true
        when: enable_log2ram | default(false) | bool

      - name: Enable log2ram
        service:
            name: log2ram
            state: started
            enabled: true
        when: enable_log2ram | default(false) | bool

      - name: Enable hardware watchdog
        lineinfile:
            path: /etc/systemd/system.conf
            regexp: '^#?RuntimeWatchdogSec='
            line: 'RuntimeWatchdogSec=15'
        notify: Reexec systemd

      - name: Enable watchdog device in systemd
        lineinfile:
            path: /etc/systemd/system.conf
            regexp: '^#?WatchdogDevice='
            line: 'WatchdogDevice=/dev/watchdog'
        notify: Reexec systemd

      - name: Create stack directories
        file:
            path: "{{ item }}"
            state: directory
            owner: "{{ stack_user }}"
            group: "{{ stack_user }}"
            mode: "0755"
        loop:
            - "{{ stack_path }}"
            - "{{ stack_path }}/caddy"
            - "{{ stack_path }}/prometheus"

      - name: Create Node Exporter textfile collector directory
        file:
            path: "{{ node_exporter_textfile_path }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

      - name: Create journald config directory
        file:
            path: /etc/systemd/journald.conf.d
            state: directory
            owner: root
            group: root
            mode: "0755"

      - name: Install journald retention limits
        copy:
            src: ./ops/journald/99-homelab-limits.conf
            dest: /etc/systemd/journald.conf.d/99-homelab-limits.conf
            owner: root
            group: root
            mode: "0644"
        register: journald_limits

      - name: Restart journald after retention limit changes
        service:
            name: systemd-journald
            state: restarted
        when: journald_limits.changed

      - name: Create NVMe-backed Docker data directories
        file:
            path: "{{ item.path }}"
            owner: "{{ item.owner }}"
            group: "{{ item.group }}"
            state: directory
            mode: "0755"
        loop:
            - { path: "{{ docker_storage_path }}", owner: "0", group: "0" }
            - { path: "{{ docker_storage_path }}/caddy/data", owner: "1000", group: "1000" }
            - { path: "{{ docker_storage_path }}/caddy/config", owner: "1000", group: "1000" }
            - { path: "{{ docker_storage_path }}/grafana", owner: "472", group: "472" }
            - { path: "{{ docker_storage_path }}/prometheus", owner: "65534", group: "65534" }
            - { path: "{{ docker_storage_path }}/portainer", owner: "0", group: "0" }

      - name: Copy docker compose
        copy:
            src: ./docker-compose.yml
            dest: "{{ stack_path }}/{{ stack_compose_file }}"
            owner: "{{ stack_user }}"
            group: "{{ stack_user }}"
            mode: "0644"

      - name: Copy Prometheus configuration
        copy:
            src: ./prometheus/
            dest: "{{ stack_path }}/prometheus/"
            owner: "{{ stack_user }}"
            group: "{{ stack_user }}"
            mode: "0644"

      - name: Copy Caddy build and configuration
        copy:
            src: "./caddy/{{ item }}"
            dest: "{{ stack_path }}/caddy/{{ item }}"
            owner: "{{ stack_user }}"
            group: "{{ stack_user }}"
            mode: "0644"
        loop:
            - Caddyfile
            - Dockerfile

      - name: Create persistent global healthcheck recovery state directory
        file:
            path: /var/lib/homelab-healthcheck
            state: directory
            owner: root
            group: root
            mode: "0700"
        when: install_homelab_healthcheck_effective | bool

      - name: Install healthcheck recovery and diagnostic helpers
        copy:
            src: "./ops/healthcheck/{{ item.source }}"
            dest: "/usr/local/sbin/{{ item.destination }}"
            owner: root
            group: root
            mode: "0755"
        loop:
            - { source: recovery.py, destination: homelab-healthcheck-recovery }
            - { source: diagnostics.py, destination: homelab-healthcheck-diagnostics }
            - { source: remote_access.py, destination: homelab-healthcheck-access }
            - { source: infrastructure.py, destination: homelab-healthcheck-infrastructure }
        when: install_homelab_healthcheck_effective | bool

      - name: Validate local remote-access probe configuration
        command:
            argv:
                - python3
                - -c
                - "import ipaddress,re,sys; ipaddress.ip_address(sys.argv[1]); assert 1 <= int(sys.argv[2]) <= 65535; assert re.fullmatch(r'[A-Za-z0-9_.-]{1,15}', sys.argv[3])"
                - "{{ healthcheck_ssh_host | default('127.0.0.1') }}"
                - "{{ healthcheck_ssh_port | default(22) }}"
                - "{{ healthcheck_tailscale_interface | default('tailscale0') }}"
        changed_when: false
        check_mode: false
        when: install_homelab_healthcheck_effective | bool

      - name: Configure local SSH, DNS, and storage probes
        copy:
            dest: /etc/default/homelab-healthcheck
            owner: root
            group: root
            mode: "0644"
            content: |
                # Local deployment endpoints and storage identity.
                SSH_CHECK_HOST={{ healthcheck_ssh_host | default('127.0.0.1') | quote }}
                SSH_CHECK_PORT={{ healthcheck_ssh_port | default(22) | int }}
                TAILSCALE_CHECK_INTERFACE={{ healthcheck_tailscale_interface | default('tailscale0') | quote }}
                NVME_UUID={{ nvme_uuid | quote }}
                PIHOLE_PROBE_NAME={{ (pihole_dns_names | default(['pihole.home.arpa']) | first) | quote }}
                PIHOLE_PROBE_ADDRESS={{ (pihole_dns_ipv4 | default(tailscale_ipv4.stdout | trim, true)) | quote }}
                UNBOUND_PROBE_PORT={{ unbound_port | default(5335) | int }}
        when: install_homelab_healthcheck_effective | bool

      - name: Install homelab healthcheck script
        copy:
            src: ./ops/healthcheck/homelab-healthcheck
            dest: /usr/local/sbin/homelab-healthcheck
            owner: root
            group: root
            mode: "0755"
        when: install_homelab_healthcheck_effective | bool

      - name: Install homelab healthcheck systemd units
        copy:
            src: "./ops/healthcheck/{{ item }}"
            dest: "/etc/systemd/system/{{ item }}"
            owner: root
            group: root
            mode: "0644"
        loop:
            - homelab-healthcheck.service
            - homelab-healthcheck.timer
        when: install_homelab_healthcheck_effective | bool
        notify: Reload systemd

      - name: Install homelab thermal monitor script
        copy:
            src: ./ops/thermal-monitor/homelab-thermal-monitor
            dest: /usr/local/sbin/homelab-thermal-monitor
            owner: root
            group: root
            mode: "0755"
        when: install_homelab_thermal_monitor_effective | bool

      - name: Install homelab thermal monitor systemd units
        copy:
            src: "./ops/thermal-monitor/{{ item }}"
            dest: "/etc/systemd/system/{{ item }}"
            owner: root
            group: root
            mode: "0644"
        loop:
            - homelab-thermal-monitor.service
            - homelab-thermal-monitor.timer
        when: install_homelab_thermal_monitor_effective | bool
        notify: Reload systemd

      - name: Enable homelab thermal monitor timer
        systemd:
            name: homelab-thermal-monitor.timer
            enabled: true
            state: started
            daemon_reload: true
        when: install_homelab_thermal_monitor_effective | bool

      - name: Write Docker Compose environment
        copy:
            dest: "{{ stack_path }}/.env"
            owner: "{{ stack_user }}"
            group: "{{ stack_user }}"
            mode: "0644"
            content: |
                DOCKER_DATA_ROOT={{ docker_storage_path }}
                SERVICE_BIND_ADDRESS={{ '127.0.0.1' if service_bind_address_requested == 'tailscale' else service_bind_address_requested }}
                TAILSCALE_IP={{ tailscale_ipv4.stdout }}
        tags:
            - compose_environment

      - name: Run containers
        command: docker compose -f {{ stack_compose_file }} up -d
        args:
            chdir: "{{ stack_path }}"

  handlers:
      - name: Reexec systemd
        command: systemctl daemon-reexec

      - name: Reload systemd
        systemd:
            daemon_reload: true

  post_tasks:
      - name: Enable homelab healthcheck timer
        systemd:
            name: homelab-healthcheck.timer
            enabled: true
            state: started
            daemon_reload: true
        when: install_homelab_healthcheck_effective | bool
