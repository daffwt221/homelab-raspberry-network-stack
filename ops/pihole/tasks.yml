- name: Prepare Unbound before installing or configuring Pi-hole
  ansible.builtin.import_tasks: unbound.yml

- name: Define Pi-hole installation checks
  ansible.builtin.set_fact:
    pihole_install_files:
      - /usr/local/bin/pihole
      - /usr/bin/pihole-FTL
      - /var/www/html/admin/index.lp
      - /etc/systemd/system/pihole-FTL.service

- name: Inspect Pi-hole components
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ pihole_install_files }}"
  register: pihole_components

- name: Check whether the existing FTL binary runs
  ansible.builtin.command: /usr/bin/pihole-FTL --version
  register: pihole_existing_version
  changed_when: false
  failed_when: false
  check_mode: false
  when: pihole_components.results[1].stat.exists

- name: Decide whether Pi-hole installation is required
  ansible.builtin.set_fact:
    pihole_install_required: >-
      {{ (pihole_repair_installation | default(false) | bool)
         or (pihole_components.results | selectattr('stat.exists', 'equalto', false) | list | length > 0)
         or (pihole_existing_version.rc | default(1) != 0) }}

- name: Install or repair Pi-hole with the official installer
  when:
    - pihole_install_required | bool
    - not ansible_check_mode
  block:
    - name: Install prerequisites for the official installer
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Clone the official Pi-hole installer
      ansible.builtin.git:
        repo: https://github.com/pi-hole/pi-hole.git
        dest: /var/tmp/homelab-pihole-installer
        version: "{{ pihole_installer_version | default('master') }}"
        depth: 1

    # The installer also installs pi-hole/web and an architecture-specific FTL binary.
    - name: Install Pi-hole without interactive prompts
      ansible.builtin.command:
        argv:
          - bash
          - basic-install.sh
          - --unattended
      args:
        chdir: /var/tmp/homelab-pihole-installer/automated install
      # The unattended installer can print an autogenerated administrator password.
      no_log: true
      changed_when: true

    - name: Verify the installed Pi-hole components
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ pihole_install_files }}"
      register: pihole_installed_components

    - name: Require a complete Pi-hole installation
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg | default(false)
          - item.stat.size | default(0) | int > 0
        fail_msg: "Pi-hole installation is incomplete: {{ item.item }}"
      loop: "{{ pihole_installed_components.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Keep the checkout on failure for debugging; only remove this temporary clone.
    - name: Remove the successful installer checkout
      ansible.builtin.file:
        path: /var/tmp/homelab-pihole-installer
        state: absent

- name: Explain installation required in check mode
  ansible.builtin.debug:
    msg: Pi-hole would be installed or repaired; DNS changes require an existing installation.
  when:
    - ansible_check_mode
    - pihole_install_required | bool

- name: Configure the managed Pi-hole DNS and web settings
  ansible.builtin.import_tasks: configure.yml

- name: Enable blocklists and verify the full DNS chain
  ansible.builtin.import_tasks: dns-services.yml
