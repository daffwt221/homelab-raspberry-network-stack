name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible shellcheck yamllint

      - name: Validate shell scripts
        run: |
          shellcheck ops/healthcheck/homelab-healthcheck
          shellcheck ops/thermal-monitor/homelab-thermal-monitor
          shellcheck ops/photo-backup/entrypoint.sh

      - name: Validate YAML
        run: |
          yamllint -c .yamllint \
            docker-compose.yml \
            prometheus/prometheus.yml \
            prometheus/alerts.yml \
            playbook.yml \
            ops/photo-backup/tasks.yml \
            ops/photo-backup/deploy.yml \
            ops/photo-backup/storage.yml \
            ops/photo-backup/secondary.yml \
            collections/requirements.yml \
            group_vars/all.yml.example \
            .github/workflows/*.yml

      - name: Validate Docker Compose
        run: |
          COMPOSE_PROJECT_NAME=homelab \
          TAILSCALE_IP=100.64.0.1 \
          docker compose config --quiet

      - name: Test photo metadata migration and backup guards
        run: sudo python3 -m unittest discover -s ops/photo-backup/tests -v

      - name: Test isolated SFTP transfer and persistence
        run: |
          docker build --tag homelab/photo-backup-sftp:test ops/photo-backup
          sudo python3 ops/photo-backup/test_sftp.py --image homelab/photo-backup-sftp:test

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - uses: docker/setup-buildx-action@v3

      - name: Build photo SFTP image for Raspberry Pi ARMv7
        run: |
          docker buildx build \
            --platform linux/arm/v7 \
            --tag homelab/photo-backup-sftp:ci \
            --load ops/photo-backup

      - name: Install declared Ansible collections
        run: ansible-galaxy collection install -r collections/requirements.yml

      - name: Validate Ansible syntax
        run: ansible-playbook -i inventory.ini playbook.yml --syntax-check

      - name: Validate Prometheus config
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.5 \
            check config /etc/prometheus/prometheus.yml
