name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible shellcheck yamllint

      - name: Validate shell scripts
        run: |
          shellcheck ops/healthcheck/homelab-healthcheck
          shellcheck ops/thermal-monitor/homelab-thermal-monitor

      - name: Validate YAML
        run: |
          yamllint -c .yamllint \
            docker-compose.yml \
            prometheus/prometheus.yml \
            prometheus/alerts.yml \
            playbook.yml \
            ops/pihole/tasks.yml \
            ops/pihole/configure.yml \
            ops/pihole/unbound.yml \
            ops/pihole/dns-services.yml \
            ops/pihole/verify.yml \
            ops/pihole/defaults.yml \
            group_vars/all.yml.example \
            .github/workflows/*.yml

      - name: Validate Docker Compose
        run: |
          COMPOSE_PROJECT_NAME=homelab \
          TAILSCALE_IP=100.64.0.1 \
          docker compose config --quiet

      - name: Test Pi-hole configuration convergence
        run: python3 -m unittest discover -s ops/pihole/tests -v

      - name: Validate Ansible syntax
        run: ansible-playbook -i inventory.ini playbook.yml --syntax-check

      - name: Validate Prometheus config
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.5 \
            check config /etc/prometheus/prometheus.yml
